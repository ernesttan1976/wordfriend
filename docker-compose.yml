version: '3.9'

services:
  db:
    image: postgres:16
    restart: unless-stopped
    env_file:
      - ./.env
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: wordfriend
    ports:
      - '5433:5432'
    volumes:
      - db-data:/var/lib/postgresql/data
      - ./backend/db/init.sql:/docker-entrypoint-initdb.d/init.sql:ro

  api:
    build: ./backend
    command: npm run dev
    working_dir: /app
    volumes:
      - ./backend:/app
      - /app/node_modules
    env_file:
      - ./.env
    environment:
      NODE_ENV: development
      PORT: 4000
      DATABASE_URL: postgres://postgres:${POSTGRES_PASSWORD}@db:5432/wordfriend
    ports:
      - '4000:4000'
    depends_on:
      - db

  livekit:
    image: livekit/livekit-server:v1.8.4
    restart: unless-stopped
    command: --config /etc/livekit.yaml
    ports:
      - '7880:7880'
      - '7881:7881/udp'
      - '50000-50050:50000-50050/udp'
    volumes:
      - ./livekit.yaml:/etc/livekit.yaml:ro

volumes:
  db-data:
